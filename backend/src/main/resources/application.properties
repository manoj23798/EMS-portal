# Server Configuration
server.port=8087

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ems_db
spring.datasource.username=postgres
spring.datasource.password=pass123

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson Configuration to prevent lazy loading serialization issues
spring.jackson.serialization.fail-on-empty-beans=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration (Load from environment variables for security, fallback to defaults)
jwt.secret=${JWT_SECRET_KEY:8z2Xb9Qp4Wm6Yv3Rt1Kc7Jd5Hn8Fq6Zs2Xb9Qp4Wm6Yv3Rt1Kc7Jd5Hn}
jwt.expiration=${JWT_EXPIRATION:86400000}

